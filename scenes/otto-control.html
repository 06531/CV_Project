<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>otto-control — scroll-world explainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="scene.css">
<script src="shell.js"></script>
<style>
  /* Who may touch a document, and where its number comes from.
     Shared shell lives in scene.css; only this scene's own layout is here. */
  /* Both halves hug their content and sit together in the middle — stretched
     to the full board width the matrix spreads out and stops reading as a
     table. */
  .split {
    margin-top: clamp(14px, 2vmin, 24px);
    display: grid;
    grid-template-columns: auto auto;
    /* Left-aligned so the tree, the matrix and the numbering row below all
       share one left edge with the prompt. */
    justify-content: start;
    gap: clamp(24px, 5vmin, 76px);
    align-items: start;
  }

  /* Account → team → role. */
  .tree { font-family: var(--mono); font-size: clamp(10px, 1.08vmin, 12.5px); line-height: 1.95; color: var(--muted); }
  .tree .node { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  /* The rails are drawn with leading spaces; HTML would collapse them. */
  .tree .rail { color: var(--line); white-space: pre; }
  .tree .lvl0 { color: var(--ink); font-weight: 700; }
  .tree .lvl1 { color: var(--ink); }
  .tree .role { color: var(--muted); }
  .tree .role.is-on { color: var(--accent); font-weight: 700; }

  /* The permission matrix. */
  .matrix { width: auto; border-collapse: collapse; font-family: var(--mono); font-size: clamp(9.5px, 1.02vmin, 12px); }
  .matrix th { font-weight: 500; color: var(--muted); text-align: center; padding: 0 clamp(7px, 1.1vmin, 14px) 6px; white-space: nowrap; }
  .matrix th:first-child { text-align: left; padding-left: 0; }
  .matrix td { text-align: center; padding: 4px clamp(7px, 1.1vmin, 14px); }
  .matrix td:first-child { text-align: left; color: var(--ink); font-weight: 600; white-space: nowrap; padding-right: 10px; }
  .matrix tr.is-on td:first-child { color: var(--accent); }
  .cell { display: inline-block; width: 14px; height: 14px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); }
  .cell.on { background: var(--accent); border-color: transparent; }

  /* prefix + padded sequence + check digit. */
  .numbering { margin-top: clamp(16px, 2.4vmin, 30px); display: flex; align-items: center; gap: clamp(12px, 2vmin, 26px); flex-wrap: wrap; }
  /* No gap — the padded zeros and the running number are one field. */
  .rule { display: flex; align-items: baseline; font-family: var(--mono); font-size: clamp(13px, 1.5vmin, 19px); font-weight: 700; color: var(--ink); letter-spacing: .02em; }
  .rule .pre { color: var(--accent); }
  .rule .pad { color: var(--muted); font-weight: 400; }
  .rule .chk { color: var(--ok); }
  .rule .sep { color: var(--line); font-weight: 400; margin: 0 .35em; }
  .legend { font-family: var(--mono); font-size: clamp(9px, .95vmin, 11px); color: var(--muted); line-height: 1.6; }

  .barcode { display: flex; align-items: flex-end; gap: 1px; height: clamp(26px, 3.6vmin, 44px); }
  .barcode i { display: block; width: 2px; height: 100%; background: var(--ink); }
  .barcode i.thin { width: 1px; opacity: .55; }

  @media (max-aspect-ratio: 3/4) {
    .split { grid-template-columns: 1fr; gap: 10px; margin-top: 10px; }
    .tree { font-size: 11px; line-height: 1.55; }
    .matrix { font-size: 10.5px; }
    .matrix th { padding-bottom: 4px; }
    .matrix td { padding: 2px 0; }
    .cell { width: 12px; height: 12px; }
    .numbering { margin-top: 10px; gap: 10px; }
    .rule { font-size: 15px; }
    .barcode { height: 22px; }
    .legend { font-size: 9.5px; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="board">
    <div class="window">
      <div class="titlebar">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="name">TDS eDOC — setup</span>
      </div>
      <div class="body">
        <div class="prompt"><span class="sigil">$</span> <span id="typed"></span><span class="caret" id="caret"></span></div>

        <div class="split">
          <div class="tree" id="tree"></div>
          <table class="matrix" id="matrix"></table>
        </div>

        <div class="numbering">
          <div class="rule" id="rule">
            <span class="pre" id="pre">OI</span><span class="sep">-</span><span class="pad" id="pad"></span><span id="num"></span><span class="sep">-</span><span class="chk" id="chk"></span>
          </div>
          <div class="barcode" id="barcode"></div>
          <div class="legend" id="legend"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const COMMAND = 'setup · roles and document numbering';

  const board = $('board'), typed = $('typed'), caret = $('caret');

  // ---- account → team → role
  const TREE = [
    { depth: 0, cls: 'lvl0', label: 'account 10042.TL', rail: '' },
    { depth: 1, cls: 'lvl1', label: 'team · Documents', rail: '├─' },
    { depth: 2, cls: 'role', label: 'Operator', rail: '│  ├─' },
    { depth: 2, cls: 'role', label: 'Supervisor', rail: '│  └─' },
    { depth: 1, cls: 'lvl1', label: 'team · QA', rail: '└─' },
    { depth: 2, cls: 'role', label: 'Admin', rail: '   └─' },
  ];
  $('tree').innerHTML = TREE.map((n) =>
    `<div class="node"><span class="rail">${n.rail}</span><span class="${n.cls}">${n.label}</span></div>`).join('');
  const treeNodes = Array.from($('tree').children);
  const roleNodes = TREE.map((n, i) => (n.cls === 'role' ? treeNodes[i] : null)).filter(Boolean);

  // ---- permission matrix. Rows line up with the roles in the tree.
  const COLS = ['create', 'view', 'edit', 'delete', 'lock'];
  const ROWS = [
    { role: 'Operator', grants: [1, 1, 1, 0, 0] },
    { role: 'Supervisor', grants: [1, 1, 1, 1, 0] },
    { role: 'Admin', grants: [1, 1, 1, 1, 1] },
  ];
  $('matrix').innerHTML =
    `<thead><tr><th></th>${COLS.map((c) => `<th>${c}</th>`).join('')}</tr></thead>` +
    `<tbody>${ROWS.map((r) => `<tr><td>${r.role}</td>${r.grants.map(() => '<td><span class="cell"></span></td>').join('')}</tr>`).join('')}</tbody>`;
  const rowEls = Array.from($('matrix').querySelectorAll('tbody tr'));
  const cellEls = rowEls.map((tr) => Array.from(tr.querySelectorAll('.cell')));

  // ---- prefix + padded sequence + check digit
  const preEl = $('pre'), padEl = $('pad'), numEl = $('num'), chkEl = $('chk'), legendEl = $('legend');
  const WIDTH = 7;

  /** Weighted mod-10, the shape of the check digit the generator adds. */
  function checkDigit(digits) {
    let sum = 0;
    for (let i = 0; i < digits.length; i++) sum += Number(digits[i]) * (i % 2 ? 3 : 1);
    return (10 - (sum % 10)) % 10;
  }

  const barcodeEl = $('barcode');
  /** Bars are a pure function of the number — no randomness, so every frame of
      a given number renders identically. */
  function renderBarcode(digits) {
    const bits = [];
    for (const d of digits) {
      const n = Number(d);
      bits.push(n % 2, (n >> 1) % 2, (n >> 2) % 2, 1);
    }
    barcodeEl.innerHTML = bits.map((b) => `<i class="${b ? '' : 'thin'}"></i>`).join('');
  }

  defineScene(function (p) {

    // 0.00–0.12 — the caption types itself out.
    const chars = Math.round(seg(p, 0.01, 0.12) * COMMAND.length);
    typed.textContent = COMMAND.slice(0, chars);
    caret.style.opacity = p > 0.16 ? 0 : (Math.floor(p * 44) % 2 ? 0.25 : 1);

    // 0.10–0.34 — the account tree unfolds top down.
    treeNodes.forEach((el, k) => {
      const t = seg(p, 0.10 + k * 0.025, 0.22 + k * 0.025);
      el.style.opacity = t;
      el.style.transform = `translateX(${(1 - t) * -8}px)`;
    });

    // 0.30–0.62 — one role at a time: highlight it, then fill its row.
    const focus = Math.min(2, Math.floor(seg(p, 0.30, 0.62) * 3.0));
    roleNodes.forEach((el, k) => el.classList.toggle('is-on', p > 0.32 && k === focus));
    rowEls.forEach((tr, k) => {
      const appear = seg(p, 0.28 + k * 0.03, 0.38 + k * 0.03);
      tr.style.opacity = appear;
      tr.classList.toggle('is-on', p > 0.32 && k === focus);
      cellEls[k].forEach((cell, c) => {
        // Cells land left to right, row by row, so the matrix reads as it fills.
        const at = 0.34 + k * 0.09 + c * 0.016;
        cell.classList.toggle('on', ROWS[k].grants[c] === 1 && p > at);
      });
    });

    // 0.64–0.94 — the numbering rule, then it counts, then it rolls over.
    const numT = seg(p, 0.62, 0.72);
    $('rule').style.opacity = numT;
    barcodeEl.style.opacity = numT;
    legendEl.style.opacity = numT;

    const rolled = p >= 0.88;
    let value;
    if (rolled) {
      // Past the width the sequence resets and the prefix advances — the case
      // that has to be handled, not the happy path.
      value = 1;
      preEl.textContent = 'OJ';
    } else {
      const ticks = Math.floor(seg(p, 0.70, 0.86) * 14);
      value = 1238 + ticks;
      preEl.textContent = 'OI';
    }
    const raw = String(value);
    const padded = raw.padStart(WIDTH, '0');
    padEl.textContent = padded.slice(0, WIDTH - raw.length);
    numEl.textContent = raw;
    chkEl.textContent = String(checkDigit(padded));
    renderBarcode(padded);

    legendEl.innerHTML = rolled
      ? 'sequence exhausted &rarr; <b>prefix advances, counter resets</b>'
      : 'prefix &nbsp;·&nbsp; zero-padded to ' + WIDTH + ' &nbsp;·&nbsp; check digit';

    // Continuous slow push-in so no stretch of the clip is a frozen frame.
    const settle = seg(p, 0.92, 1);
    const scale = 1 + p * 0.04 - settle * 0.012;
    board.style.transform = `translateY(${(0.5 - p) * 22}px) scale(${scale.toFixed(4)})`;

  });
})();
</script>
</body>
</html>
