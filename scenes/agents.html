<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agents — scroll-world explainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="scene.css">
<style>
  /* Beat one of the AI workflow: one prompt picks a role out of a nine-strong
     bench, and a difficulty grade picks the model that runs it.
     Shared shell lives in scene.css; only this scene's own layout is here. */

  /* The team. All nine are on the bench; one gets picked. */
  .roster { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; margin-top: clamp(14px, 2vmin, 24px); }
  .role {
    font-family: var(--mono);
    font-size: clamp(9.5px, 1.02vmin, 12px);
    line-height: 1;
    padding: 6px 9px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--muted);
    white-space: nowrap;
  }
  .role.is-picked { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }

  .flow { position: relative; margin-top: clamp(24px, 3.4vmin, 44px); }
  #wires path { opacity: .5; }

  /* Difficulty decides the model — the same role runs on a different brain. */
  .routes { position: relative; margin-top: 10px; display: grid; gap: 3px; }
  .route {
    position: relative; z-index: 1;
    display: grid; grid-template-columns: 4.6em 1.2em auto; align-items: center; gap: 8px;
    padding: 5px 9px;
    font-family: var(--mono);
    font-size: clamp(10px, 1.1vmin, 13px);
    line-height: 1.15;
    color: var(--muted);
  }
  .route .mdl { color: var(--ink); font-weight: 600; }
  .route .arrow { color: var(--line); }
  .route.is-picked .lvl, .route.is-picked .arrow { color: var(--accent); }
  .route.is-picked .mdl { color: var(--accent); font-weight: 700; }
  .pick {
    position: absolute; left: 0; right: 0; z-index: 0;
    border-radius: 7px;
    background: var(--accent-soft);
  }

  .card.is-lead { min-width: clamp(220px, 30vmin, 340px); }

  @media (max-aspect-ratio: 3/4) {
    .roster { gap: 4px; margin-top: 12px; }
    .role { font-size: 10.5px; padding: 5px 7px; }
    .flow { margin-top: 16px; }
    .routes { margin-top: 8px; }
    .route { font-size: 11.5px; padding: 4px 8px; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="board">
    <div class="window">
      <div class="titlebar">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="name">claude code — CV_project</span>
      </div>
      <div class="body">
        <div class="prompt"><span class="sigil">$</span> <span id="typed"></span><span class="caret" id="caret"></span></div>

        <div class="roster" id="roster"></div>

        <div class="flow" id="flow">
          <svg id="wires" class="wires" preserveAspectRatio="none"><path id="wirePick"></path></svg>

          <div class="row">
            <div class="card is-lead" id="cardDispatch">
              <div class="card__head">
                <!-- lucide: git-branch -->
                <svg viewBox="0 0 24 24"><line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>
                <span class="card__name">dispatcher</span>
              </div>
              <div class="card__meta" id="dispatchMeta"></div>
              <div class="routes" id="routes">
                <div class="pick" id="pick"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const COMMAND = 'hand off to IT team: add a portfolio project';
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  // Smoothstep over an arbitrary window of the timeline.
  const seg = (p, from, to) => { const x = clamp((p - from) / (to - from), 0, 1); return x * x * (3 - 2 * x); };

  const $ = (id) => document.getElementById(id);
  const board = $('board'), typed = $('typed'), caret = $('caret');
  const cardDispatch = $('cardDispatch'), wirePick = $('wirePick');

  // ---- The bench. Order matches .claude/agents/.
  const ROSTER = ['dispatcher', 'architect', 'developer', 'ui-ux', 'tester', 'qa', 'security', 'devops', 'docs'];
  const PICKED = 'developer';
  const rosterEl = $('roster');
  rosterEl.innerHTML = ROSTER.map((r) => `<span class="role" data-role="${r}">${r}</span>`).join('');
  const roleChips = Array.from(rosterEl.children);
  const pickedChip = roleChips[ROSTER.indexOf(PICKED)];

  // ---- What the dispatcher decides.
  const META = ['role: developer', 'difficulty: medium'];
  $('dispatchMeta').innerHTML = META.map((label) => `<span class="chip">${label}</span>`).join('');
  const metaChips = Array.from($('dispatchMeta').children);

  // ---- Difficulty → model. The row that matches lights up.
  const ROUTES = [
    ['easy', 'haiku'],
    ['medium', 'sonnet'],
    ['hard', 'opus'],
  ];
  const PICKED_ROW = 1;
  const routesEl = $('routes'), pick = $('pick');
  routesEl.insertAdjacentHTML(
    'beforeend',
    ROUTES.map(([lvl, mdl]) =>
      `<div class="route"><span class="lvl">${lvl}</span><span class="arrow">&rarr;</span><span class="mdl">${mdl}</span></div>`,
    ).join(''),
  );
  const routeRows = Array.from(routesEl.querySelectorAll('.route'));

  /** Wire from the chosen role chip down into the dispatcher. Measured every
      frame in layout units, because the board carries a scale transform and the
      SVG's user units are pre-transform. */
  function wirePath() {
    const flow = document.getElementById('flow');
    // The chip lives outside .flow, so bring its position into .flow's space.
    const x0 = pickedChip.offsetLeft + pickedChip.offsetWidth / 2 - flow.offsetLeft;
    const y0 = pickedChip.offsetTop + pickedChip.offsetHeight - flow.offsetTop;
    const x1 = cardDispatch.offsetLeft + cardDispatch.offsetWidth / 2;
    const y1 = cardDispatch.offsetTop;
    const mid = y0 + (y1 - y0) * 0.55;
    wirePick.setAttribute('d', `M ${x0} ${y0} C ${x0} ${mid}, ${x1} ${mid}, ${x1} ${y1}`);
  }

  /** Park the highlight over one routing row. Measured, because the rows are
      sized in vmin and the board is scaled. */
  function placePick(rowIndex, grown) {
    const row = routeRows[rowIndex];
    if (!row) return;
    pick.style.top = row.offsetTop + 'px';
    pick.style.height = row.offsetHeight + 'px';
    pick.style.opacity = grown;
    pick.style.transform = `scaleX(${(0.86 + grown * 0.14).toFixed(4)})`;
  }

  function reveal(el, t, lift) {
    el.style.opacity = t;
    el.style.transform = `translateY(${(1 - t) * (lift == null ? 14 : lift)}px)`;
  }

  let last = { i: 0, total: 2 };

  window.__setFrame = function (i, total) {
    last = { i, total };
    const p = total > 1 ? clamp(i / (total - 1), 0, 1) : 0;
    wirePath();

    // 0.00–0.18 — the command types itself out.
    const typeT = seg(p, 0.02, 0.18);
    const chars = Math.round(typeT * COMMAND.length);
    typed.textContent = COMMAND.slice(0, chars);
    // Deterministic blink: on/off by frame band rather than by wall clock.
    caret.style.opacity = p > 0.21 ? 0 : (Math.floor(p * 44) % 2 ? 0.25 : 1);

    // 0.18–0.42 — the whole bench turns up, one after another.
    roleChips.forEach((chip, k) => {
      const t = seg(p, 0.18 + k * 0.018, 0.30 + k * 0.018);
      chip.style.opacity = t;
      chip.style.transform = `translateY(${(1 - t) * 8}px)`;
      // …and then one of them is the answer.
      chip.classList.toggle('is-picked', p > 0.46 && chip.dataset.role === PICKED);
    });

    // 0.48–0.60 — a wire drops from the chosen role into the dispatcher.
    const wireT = seg(p, 0.48, 0.60);
    const len = wirePick.getTotalLength();
    wirePick.style.strokeDasharray = len;
    wirePick.style.strokeDashoffset = len * (1 - wireT);

    // 0.54–0.68 — the dispatcher lands and states its verdict.
    reveal(cardDispatch, seg(p, 0.54, 0.66));
    metaChips.forEach((chip, k) => {
      const t = seg(p, 0.62 + k * 0.04, 0.70 + k * 0.04);
      chip.style.opacity = t;
      chip.style.transform = `scale(${0.9 + t * 0.1})`;
    });

    // 0.72–0.94 — the routing table fills in, then the matching row lights up.
    routeRows.forEach((row, k) => {
      const t = seg(p, 0.72 + k * 0.04, 0.80 + k * 0.04);
      row.style.opacity = t;
      row.classList.toggle('is-picked', p > 0.90 && k === PICKED_ROW);
    });
    placePick(PICKED_ROW, seg(p, 0.86, 0.94));

    // Continuous slow push-in so no stretch of the clip is a frozen frame.
    const settle = seg(p, 0.90, 1);
    const scale = 1 + p * 0.05 - settle * 0.012;
    board.style.transform = `translateY(${(0.5 - p) * 26}px) scale(${scale.toFixed(4)})`;

    document.documentElement.dataset.frame = String(i);
  };

  window.__setFrame(0, 2);
  window.addEventListener('resize', () => window.__setFrame(last.i, last.total));
})();
</script>
</body>
</html>
