<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agents — scroll-world explainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="scene.css">
<style>
  /* The AI multi-agent workflow: one prompt fans out to a whole team.
     Shared shell lives in scene.css; only this scene's own layout is here. */
  .flow { position: relative; margin-top: clamp(18px, 2.4vmin, 30px); }
  #wires path { opacity: .55; }
  .row.pair { gap: clamp(16px, 3vmin, 44px); margin-top: clamp(52px, 7vmin, 92px); }

  @media (max-aspect-ratio: 3/4) {
    .flow { margin-top: 10px; }
    .row.pair { flex-direction: column; align-items: stretch; gap: 6px; margin-top: 16px; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="board">
    <div class="window">
      <div class="titlebar">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="name">claude code — CV_project</span>
      </div>
      <div class="body">
        <div class="prompt"><span class="sigil">$</span> <span id="typed"></span><span class="caret" id="caret"></span></div>

        <div class="flow" id="flow">
          <svg id="wires" class="wires" preserveAspectRatio="none"><path id="wireL"></path><path id="wireR"></path></svg>

          <div class="row">
            <div class="card is-lead" id="cardDispatch">
              <div class="card__head">
                <!-- lucide: git-branch -->
                <svg viewBox="0 0 24 24"><line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>
                <span class="card__name">dispatcher</span>
              </div>
              <div class="card__meta" id="dispatchMeta"></div>
            </div>
          </div>

          <div class="row pair">
            <div class="card" id="cardDev">
              <div class="card__head">
                <!-- lucide: code -->
                <svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                <span class="card__name">developer</span>
              </div>
              <div class="card__meta"><span class="chip is-model">model: sonnet</span><span class="chip">implement</span></div>
            </div>
            <div class="card" id="cardTest">
              <div class="card__head">
                <!-- lucide: check-check -->
                <svg viewBox="0 0 24 24"><path d="m18 6-8.5 8.5L5 10"/><path d="m22 10-7.5 7.5L13 16"/></svg>
                <span class="card__name">tester</span>
              </div>
              <div class="card__meta"><span class="chip is-model">model: sonnet</span><span class="chip">verify</span></div>
            </div>
          </div>
        </div>

        <ul class="log" id="log">
          <li><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg><span><b>4 files</b> changed &nbsp;·&nbsp; data + messages (en / zh-HK)</span></li>
          <li><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg><span><b>typecheck</b> passed &nbsp;·&nbsp; 0 errors</span></li>
          <li><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg><span><b>next build</b> &nbsp;·&nbsp; 17 routes prerendered</span></li>
        </ul>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const COMMAND = 'hand off to IT team: add a portfolio project';
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  // Smoothstep over an arbitrary window of the timeline.
  const seg = (p, from, to) => { const x = clamp((p - from) / (to - from), 0, 1); return x * x * (3 - 2 * x); };

  const $ = (id) => document.getElementById(id);
  const board = $('board'), typed = $('typed'), caret = $('caret');
  const dispatchMeta = $('dispatchMeta');
  const cards = { dispatch: $('cardDispatch'), dev: $('cardDev'), test: $('cardTest') };
  const wires = { L: $('wireL'), R: $('wireR') };
  const logItems = Array.from($('log').children);

  const META = [
    { label: 'role: developer', model: false },
    { label: 'difficulty: medium', model: false },
    { label: 'model: sonnet', model: true },
  ];
  dispatchMeta.innerHTML = META
    .map((m) => `<span class="chip${m.model ? ' is-model' : ''}">${m.label}</span>`)
    .join('');
  const metaChips = Array.from(dispatchMeta.children);

  /** Redraw the connector paths — the flow box is fluid, so measure each frame.
      Uses offset* (layout units, relative to the positioned .flow) rather than
      getBoundingClientRect, because the board carries a scale transform and the
      SVG's user units are pre-transform. */
  function wirePaths() {
    const x0 = cards.dispatch.offsetLeft + cards.dispatch.offsetWidth / 2;
    const y0 = cards.dispatch.offsetTop + cards.dispatch.offsetHeight;
    for (const [key, el] of [['L', cards.dev], ['R', cards.test]]) {
      const x1 = el.offsetLeft + el.offsetWidth / 2;
      const y1 = el.offsetTop;
      const mid = y0 + (y1 - y0) * 0.55;
      wires[key].setAttribute('d', `M ${x0} ${y0} C ${x0} ${mid}, ${x1} ${mid}, ${x1} ${y1}`);
    }
  }

  function reveal(el, t, lift) {
    el.style.opacity = t;
    el.style.transform = `translateY(${(1 - t) * (lift == null ? 14 : lift)}px)`;
  }

  let last = { i: 0, total: 2 };

  window.__setFrame = function (i, total) {
    last = { i, total };
    const p = total > 1 ? clamp(i / (total - 1), 0, 1) : 0;
    wirePaths();

    // 0.00–0.20 — the command types itself out.
    const typeT = seg(p, 0.02, 0.20);
    const chars = Math.round(typeT * COMMAND.length);
    typed.textContent = COMMAND.slice(0, chars);
    // Deterministic blink: on/off by frame band rather than by wall clock.
    caret.style.opacity = p > 0.24 ? 0 : (Math.floor(p * 40) % 2 ? 0.25 : 1);

    // 0.16–0.34 — dispatcher lands, then its verdict chips resolve one by one.
    reveal(cards.dispatch, seg(p, 0.16, 0.30));
    metaChips.forEach((chip, k) => {
      const t = seg(p, 0.26 + k * 0.035, 0.34 + k * 0.035);
      chip.style.opacity = t;
      chip.style.transform = `scale(${0.9 + t * 0.1})`;
    });

    // 0.36–0.56 — wires draw down, then the two workers appear.
    const wireT = seg(p, 0.36, 0.52);
    for (const key of ['L', 'R']) {
      const el = wires[key];
      const len = el.getTotalLength();
      el.style.strokeDasharray = len;
      el.style.strokeDashoffset = len * (1 - wireT);
    }
    reveal(cards.dev, seg(p, 0.44, 0.58));
    reveal(cards.test, seg(p, 0.49, 0.63));

    // 0.62–0.90 — verification log prints line by line.
    logItems.forEach((li, k) => reveal(li, seg(p, 0.62 + k * 0.07, 0.76 + k * 0.07), 8));

    // Continuous slow push-in so no stretch of the clip is a frozen frame,
    // easing off at the end where the copy layer's CTA takes over.
    const settle = seg(p, 0.86, 1);
    const scale = 1 + p * 0.05 - settle * 0.012;
    board.style.transform = `translateY(${(0.5 - p) * 26}px) scale(${scale.toFixed(4)})`;

    document.documentElement.dataset.frame = String(i);
  };

  window.__setFrame(0, 2);
  window.addEventListener('resize', () => window.__setFrame(last.i, last.total));
})();
</script>
</body>
</html>
